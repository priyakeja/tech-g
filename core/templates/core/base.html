{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ site.site_title|default:"Tech G" }}</title>
{% if site.favicon %}
    <link rel="icon" href="{{ site.favicon.url }}">
{% elif site.logo_image %}
    <link rel="icon" href="{{ site.logo_image.url }}">
{% endif %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
 <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css">
    <link rel="stylesheet" href="{% static 'core/css/base.css' %}">
  <link rel="stylesheet" href="{% static 'core/css/sections.css' %}">
</head>
<body>
  {% include 'core/sections/navbar.html' %}
  {% block content %}{% endblock %}
  {% include 'core/sections/footer.html' %}
  <script src="{% static 'core/js/main.js' %}"></script>
</body>
</html>
